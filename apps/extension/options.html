<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>서비스 설정 · VIBE CODING WORKSPACE</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <header class="page-header">
      <a class="brand" href="sidepanel.html"><span class="brand-mark">V</span><span><strong>VIBE CODING WORKSPACE</strong><small>서비스 설정</small></span></a>
      <button class="restore-button" id="restore-button" type="button">기본 서비스 복원</button>
    </header>
    <main class="page-content">
      <section class="intro-card">
        <p class="eyebrow">내 작업공간</p>
        <h1>서비스를 관리하세요</h1>
        <p>이름과 접속 주소, 표시 순서를 바꿀 수 있습니다. 새 사이트를 추가하면 해당 도메인 탭을 찾기 위한 권한을 요청합니다.</p>
      </section>
      <div class="section-title"><div><h2>내 서비스</h2><p id="service-summary">불러오는 중…</p></div></div>
      <section class="service-editor-list" id="service-editor-list" aria-live="polite"></section>
      <section class="add-card" aria-labelledby="add-heading">
        <div class="add-heading"><span class="add-symbol">+</span><div><h2 id="add-heading">새 서비스 추가</h2><p>공개 웹사이트 주소를 입력하세요. 암호나 토큰이 포함된 주소는 저장하지 마세요.</p></div></div>
        <form id="add-form" class="add-form">
          <label>서비스 이름<input id="new-name" name="name" maxlength="40" placeholder="예: 문서 도구" required></label>
          <label>접속 주소<input id="new-url" name="url" type="url" placeholder="https://example.com/" required></label>
          <button class="primary-button" type="submit">서비스 추가</button>
        </form>
      </section>
      <aside class="privacy-note"><strong>권한과 개인정보</strong><p>서비스의 탭 주소를 찾는 데 필요한 도메인 권한만 사용합니다. 로그인 암호, 쿠키 또는 페이지 내용을 읽거나 외부 서버로 전송하지 않습니다.</p></aside>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
